<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マインスイーパー</title>
    <style>
        body {
            font-family: sans-serif;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 30px);
            gap: 2px;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: #ccc;
            border: 1px solid #999;
            text-align: center;
            line-height: 30px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }

        .cell.open {
            background-color: #eee;
            cursor: default;
        }

        .cell.mine {
            background-color: #f88;
        }
    </style>
</head>

<body>
    <h1>マインスイーパー</h1>
    <div id="board"></div>

    <script>
        const SIZE = 9;
        const MINES = 10;

        const board = document.getElementById("board");
        const cells = [];

        // 地雷配置
        function createMines() {
            const set = new Set();
            while (set.size < MINES) {
                set.add(Math.floor(Math.random() * SIZE * SIZE));
            }
            return set;
        }

        const mines = createMines();

        // 周囲の地雷数を数える
        function countAdjacentMines(index) {
            const x = index % SIZE;
            const y = Math.floor(index / SIZE);
            let count = 0;

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;

                    const nx = x + dx;
                    const ny = y + dy;

                    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
                        const nIndex = ny * SIZE + nx;
                        if (cells[nIndex].isMine) count++;
                    }
                }
            }
            return count;
        }

        // 盤面生成
        for (let i = 0; i < SIZE * SIZE; i++) {
            const cell = document.createElement("div");
            cell.className = "cell";

            const isMine = mines.has(i);
            cells.push({ element: cell, isMine, opened: false });

            cell.addEventListener("click", () => {
                openCell(i);
            });

            board.appendChild(cell);
        }

        // マスを開く（連鎖対応）
        function openCell(index) {
            const cellData = cells[index];
            const cell = cellData.element;

            if (cellData.opened) return;
            cellData.opened = true;
            cell.classList.add("open");

            if (cellData.isMine) {
                cell.textContent = "💣";
                cell.classList.add("mine");
                alert("ゲームオーバー！");
                revealMines();
                return;
            }

            const count = countAdjacentMines(index);
            if (count > 0) {
                cell.textContent = count;
                return;
            }

            // 周囲に地雷がない場合 → 連鎖オープン
            const x = index % SIZE;
            const y = Math.floor(index / SIZE);

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const nx = x + dx;
                    const ny = y + dy;

                    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
                        const nIndex = ny * SIZE + nx;
                        if (!cells[nIndex].opened) {
                            openCell(nIndex);
                        }
                    }
                }
            }
        }

        function revealMines() {
            cells.forEach(c => {
                if (c.isMine) {
                    c.element.textContent = "💣";
                    c.element.classList.add("open", "mine");
                }
            });
        }
    </script>
</body>
</html>
