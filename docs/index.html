<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マインスイーパー</title>
    <style>
        body {
            font-family: sans-serif;
        }

        #controls {
            margin-bottom: 10px;
        }

        #board {
            display: grid;
            gap: 2px;
        }

        .cell {
            width: 28px;
            height: 28px;
            background-color: #ccc;
            border: 1px solid #999;
            text-align: center;
            line-height: 28px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }

        .cell.open {
            background-color: #eee;
            cursor: default;
        }

        .cell.mine {
            background-color: #f88;
        }

        details {
            margin-bottom: 12px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>マインスイーパー</h1>

    <!-- ルール（折りたたみ） -->
    <details>
        <summary>▶ ルールを見る</summary>
        <p>
            左クリックでマスを開きます。<br>
            右クリックで旗（🚩）を立てられます。<br>
            数字は周囲8マスの地雷数を表します。<br>
            地雷を踏むとゲームオーバーです。<br>
            地雷以外をすべて開くとクリアです。
        </p>
    </details>

    <!-- 操作パネル -->
    <div id="controls">
        難易度：
        <select id="difficulty">
            <option value="easy">初級</option>
            <option value="medium">中級</option>
            <option value="hard">上級</option>
        </select>
        <button id="resetBtn">リセット</button>
    </div>

    <div id="board"></div>

    <script>
        const DIFFICULTY_SETTINGS = {
            easy:   { sizeX: 9,  sizeY: 9,  mines: 10 },
            medium: { sizeX: 16, sizeY: 16, mines: 40 },
            hard:   { sizeX: 30, sizeY: 16, mines: 99 }
        };

        const board = document.getElementById("board");
        const resetBtn = document.getElementById("resetBtn");
        const difficultySelect = document.getElementById("difficulty");

        let SIZE_X, SIZE_Y, MINES;
        let cells = [];
        let gameOver = false;

        resetBtn.addEventListener("click", initGame);
        difficultySelect.addEventListener("change", initGame);

        initGame();

        function initGame() {
            const diff = DIFFICULTY_SETTINGS[difficultySelect.value];
            SIZE_X = diff.sizeX;
            SIZE_Y = diff.sizeY;
            MINES = diff.mines;

            board.innerHTML = "";
            board.style.gridTemplateColumns = `repeat(${SIZE_X}, 28px)`;

            cells = [];
            gameOver = false;

            const mines = createMines();

            for (let i = 0; i < SIZE_X * SIZE_Y; i++) {
                const cell = document.createElement("div");
                cell.className = "cell";

                cells.push({
                    element: cell,
                    isMine: mines.has(i),
                    opened: false,
                    flagged: false
                });

                cell.addEventListener("click", () => {
                    if (gameOver || cells[i].flagged) return;
                    openCell(i);
                });

                cell.addEventListener("contextmenu", (e) => {
                    e.preventDefault();
                    if (gameOver) return;
                    toggleFlag(i);
                });

                board.appendChild(cell);
            }
        }

        function createMines() {
            const set = new Set();
            while (set.size < MINES) {
                set.add(Math.floor(Math.random() * SIZE_X * SIZE_Y));
            }
            return set;
        }

        function countAdjacentMines(index) {
            const x = index % SIZE_X;
            const y = Math.floor(index / SIZE_X);
            let count = 0;

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < SIZE_X && ny >= 0 && ny < SIZE_Y) {
                        const ni = ny * SIZE_X + nx;
                        if (cells[ni].isMine) count++;
                    }
                }
            }
            return count;
        }

        function toggleFlag(index) {
            const c = cells[index];
            if (c.opened) return;
            c.flagged = !c.flagged;
            c.element.textContent = c.flagged ? "🚩" : "";
        }

        function openCell(index) {
            const c = cells[index];
            if (c.opened) return;

            c.opened = true;
            c.element.classList.add("open");

            if (c.isMine) {
                c.element.textContent = "💣";
                c.element.classList.add("mine");
                gameOver = true;
                revealMines();
                alert("ゲームオーバー！");
                return;
            }

            const count = countAdjacentMines(index);
            if (count > 0) {
                c.element.textContent = count;
            } else {
                const x = index % SIZE_X;
                const y = Math.floor(index / SIZE_X);

                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        const nx = x + dx;
                        const ny = y + dy;
                        if (nx >= 0 && nx < SIZE_X && ny >= 0 && ny < SIZE_Y) {
                            openCell(ny * SIZE_X + nx);
                        }
                    }
                }
            }

            checkClear();
        }

        function checkClear() {
            const openedCount = cells.filter(c => c.opened).length;
            if (openedCount === SIZE_X * SIZE_Y - MINES) {
                gameOver = true;
                alert("🎉 クリア！");
            }
        }

        function revealMines() {
            cells.forEach(c => {
                if (c.isMine) {
                    c.element.textContent = "💣";
                    c.element.classList.add("open", "mine");
                }
            });
        }
    </script>
</body>
</html>
